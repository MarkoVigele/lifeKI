name: PR Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        if: github.event.action != 'closed'
        run: |
          if [ -f sim-core/Cargo.toml ]; then
            echo "sim-core present; trying WASM engine (wasm32 + wasm-bindgen)"
            if rustup target add wasm32-unknown-unknown \
              && cargo install wasm-bindgen-cli --version 0.2.100 --locked \
              && cargo build --manifest-path sim-core/Cargo.toml --target wasm32-unknown-unknown --release \
              && wasm-bindgen --target web --out-dir src/wasm/pkg \
                   sim-core/target/wasm32-unknown-unknown/release/anima_core.wasm
            then
              echo "WASM engine built"
            else
              echo "WASM build failed; continuing with JS engine path"
            fi
          else
            echo "No sim-core; JS engine path"
          fi
          npm install
          npm run build

      - name: Deploy preview
        if: github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: pr/${{ github.event.number }}
          clean: true
          force: false

      - name: Preview-Kommentar
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lifeKI-pr-preview
          message: |
            Preview: https://markovigele.github.io/lifeKI/pr/${{ github.event.number }}/

      - name: Remove preview
        if: github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages-preview
          rm -rf "gh-pages-preview/pr/${{ github.event.number }}"
          cd gh-pages-preview
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to remove"
            exit 0
          fi
          git commit -m "Remove preview for PR ${{ github.event.number }}"
          git push

      - name: Preview-Kommentar schließen
        if: github.event.action == 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lifeKI-pr-preview
          message: |
            Preview entfernt.
