name: GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: |
          if [ -f sim-core/Cargo.toml ]; then
            echo "sim-core present; trying WASM engine (wasm32 + wasm-bindgen)"
            if rustup target add wasm32-unknown-unknown \
              && cargo install wasm-bindgen-cli --version 0.2.100 --locked \
              && cargo build --manifest-path sim-core/Cargo.toml --target wasm32-unknown-unknown --release \
              && wasm-bindgen --target web --out-dir src/wasm/pkg \
                   sim-core/target/wasm32-unknown-unknown/release/anima_core.wasm
            then
              echo "WASM engine built"
            else
              echo "WASM build failed; continuing with JS engine path"
            fi
          else
            echo "No sim-core; JS engine path"
          fi
          npm install
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
